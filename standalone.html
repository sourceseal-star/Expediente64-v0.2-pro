<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EXPEDIENTE 64 — Sourceseal Global Protocol</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
#game-canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; }

/* ── HUD ── */
#hud { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
#level-name { position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 3px; color: #d4af37; text-transform: uppercase; opacity: 0.85; }
#objective-bar { position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 1px; color: #8899bb; max-width: 520px; text-align: center; }
#evidence-counter { position: absolute; top: 18px; right: 22px;
  font-size: 11px; color: #d4af37; letter-spacing: 2px; opacity: 0.8; }
#interact-prompt { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: #fff; letter-spacing: 2px; opacity: 0;
  transition: opacity 0.3s; background: rgba(0,0,0,0.55); padding: 6px 18px;
  border: 1px solid rgba(212,175,55,0.4); }
#interact-prompt.visible { opacity: 1; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 14px; height: 14px; opacity: 0.6; }
#crosshair::before, #crosshair::after { content:''; position:absolute; background:#d4af37; }
#crosshair::before { width:1px; height:14px; left:6px; top:0; }
#crosshair::after  { width:14px; height:1px; left:0; top:6px; }
#drive-btn { position: absolute; bottom: 28px; right: 28px; pointer-events: all;
  background: rgba(212,175,55,0.12); border: 1px solid #d4af37; color: #d4af37;
  font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 2px;
  padding: 10px 22px; cursor: pointer; text-transform: uppercase; display: none;
  transition: background 0.2s; }
#drive-btn:hover { background: rgba(212,175,55,0.28); }

/* ── Detection meter ── */
#detection-bar-wrap { position: absolute; bottom: 28px; left: 22px; width: 160px; display: none; }
#detection-label { font-size: 9px; letter-spacing: 2px; color: #ff6644; margin-bottom: 4px; }
#detection-bar-bg { width: 100%; height: 4px; background: rgba(255,100,68,0.2); }
#detection-bar-fill { height: 4px; background: #ff6644; width: 0%; transition: width 0.1s; }

/* ── NARRATIVE SCREEN ── */
#narrative-screen { position: fixed; inset: 0; background: #000; z-index: 50;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  opacity: 0; transition: opacity 0.7s; pointer-events: none; }
#narrative-screen.visible { opacity: 1; pointer-events: all; }
#narrative-text { font-size: clamp(18px, 3.5vw, 32px); color: #f0f0f0; letter-spacing: 3px;
  text-align: center; max-width: 680px; line-height: 1.5; white-space: pre-wrap; }
#narrative-sub { margin-top: 14px; font-size: 12px; color: #d4af37; letter-spacing: 4px;
  text-transform: uppercase; min-height: 20px; }

/* ── CINEMATIC TEXT BANNER ── */
#cinematic-text-banner { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: #ccc; letter-spacing: 2px; background: rgba(0,0,0,0.7);
  padding: 8px 22px; border-left: 2px solid #d4af37; display: none; opacity: 0;
  transition: opacity 0.6s; z-index: 30; }
#cinematic-text-banner.visible { opacity: 1; }

/* ── FILE VIEWER ── */
#file-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88);
  z-index: 40; display: none; align-items: center; justify-content: center; }
#file-overlay.open { display: flex; }
#file-panel { background: #0a0d14; border: 1px solid #1e2a40; width: min(560px,92vw);
  max-height: 88vh; overflow-y: auto; padding: 28px 32px; }
#file-panel-title { font-size: 11px; color: #d4af37; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
.file-item { border-bottom: 1px solid #1a2030; padding: 14px 0; cursor: pointer; transition: background 0.15s; }
.file-item:hover { background: rgba(212,175,55,0.06); }
.file-item-header { display: flex; gap: 12px; align-items: center; }
.file-tag { font-size: 8px; letter-spacing: 2px; padding: 3px 8px;
  border: 1px solid #d4af37; color: #d4af37; }
.file-name { font-size: 12px; color: #ccc; letter-spacing: 1px; }
.file-meta { font-size: 10px; color: #556; margin-top: 5px; }
.file-detail { font-size: 11px; color: #8ab; margin-top: 8px; line-height: 1.6;
  display: none; border-left: 2px solid #d4af37; padding-left: 12px; }
.file-item.expanded .file-detail { display: block; }
.file-item.verified .file-name::after { content: ' ✓'; color: #4a9; }
#file-close-btn { display: block; margin-top: 22px; width: 100%; padding: 10px;
  background: transparent; border: 1px solid #334; color: #667; cursor: pointer;
  font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px;
  transition: border-color 0.2s, color 0.2s; text-transform: uppercase; }
#file-close-btn:hover { border-color: #d4af37; color: #d4af37; }

/* ── DEDUCTION BOARD ── */
#deduction-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; }
#deduction-panel { background: #08090f; border: 1px solid #2a3050; width: min(700px,95vw);
  max-height: 92vh; overflow-y: auto; padding: 30px 32px; }
#deduction-title { font-size: 11px; color: #d4af37; letter-spacing: 3px; margin-bottom: 24px; text-transform: uppercase; }
#deduction-clues { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.clue-node { padding: 10px 16px; border: 1px solid #2a3050; font-size: 11px;
  color: #8899bb; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
.clue-node:hover { border-color: #d4af37; color: #d4af37; }
.clue-node.selected { border-color: #d4af37; background: rgba(212,175,55,0.12); color: #d4af37; }
.clue-node.connected { border-color: #4a9; color: #4a9; background: rgba(68,170,136,0.08); }
#deduction-connections-list { margin-bottom: 16px; min-height: 20px; }
.connection-line-item { font-size: 10px; color: #4a9; letter-spacing: 1px; padding: 4px 0; }
#deduction-feedback { font-size: 11px; letter-spacing: 2px; min-height: 18px; margin-bottom: 10px; }
.feedback-success { color: #4a9; }
.feedback-fail { color: #e74; }
#deduction-progress { font-size: 10px; color: #556; letter-spacing: 2px; margin-bottom: 16px; }
#deduction-conclusion { display: none; font-size: 12px; color: #bbc; letter-spacing: 1px; line-height: 1.7;
  border-left: 2px solid #d4af37; padding-left: 14px; margin-bottom: 18px; }
#deduction-continue-btn { display: none; width: 100%; padding: 11px; background: transparent;
  border: 1px solid #d4af37; color: #d4af37; cursor: pointer; font-family: 'Courier New', monospace;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase; transition: background 0.2s; }
#deduction-continue-btn:hover { background: rgba(212,175,55,0.14); }

/* ── DIALOGUE ── */
#dialogue-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88);
  z-index: 40; display: none; align-items: flex-end; justify-content: center; padding-bottom: 40px; }
#dialogue-panel { background: #070810; border: 1px solid #1e2a40; width: min(660px,92vw); padding: 24px 28px; }
#dialogue-npc-name { font-size: 10px; color: #d4af37; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
#dialogue-npc-line { font-size: 13px; color: #ccd; letter-spacing: 1px; line-height: 1.7;

#dialogue-options { display: flex; flex-direction: column; gap: 8px; }
.dialogue-option-btn { padding: 11px 16px; background: transparent; border: 1px solid #2a3050;

.dialogue-end-btn:hover { background: rgba(68,170,136,0.1); }

#mobile-controls { display: none; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 20;
  pointer-events: none; padding: 16px; }
#joystick-zone { position: absolute; bottom: 28px; left: 28px; width: 110px; height: 110px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%; pointer-events: all; touch-action: none; }
#joystick-thumb { position: absolute; width: 44px; height: 44px;
  background: rgba(212,175,55,0.35); border: 1px solid #d4af37;
  border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%,-50%); }
#mobile-interact-btn { position: absolute; bottom: 44px; right: 32px;

  border: 1px solid #d4af37; color: #d4af37; font-family: 'Courier New', monospace;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase; pointer-events: all;
  touch-action: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#look-zone { position: fixed; top: 0; right: 0; width: 55%; height: 100%; z-index: 15;
  pointer-events: all; touch-action: none; display: none; }

@media (pointer: coarse) {
  #mobile-controls { display: block; }
  #look-zone { display: block; }
}
</style>

// STATE
// ============================================================
const STATE = {
  currentLevel: 'intro',
  verifiedEvidence: new Set(),
  totalEvidenceThisLevel: 0,
  player: { x: 0, z: 3, rotY: Math.PI, speed: 2.4 },
  moveVector: { x: 0, z: 0 },
  nearInteractable: null,
  interactables: [],

// ============================================================
// THREE.JS SETUP
// ============================================================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 8, 22);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 100);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function clearLevel() {
  while (scene.children.length > 0) scene.remove(scene.children[0]);
  STATE.interactables = [];
  StealthSystem.reset();
}
function addAmbient(intensity = 0.35, color = 0x4060ff) { scene.add(new THREE.AmbientLight(color, intensity)); }
function addSpot(x, y, z, target, color = 0xd4af37, intensity = 1.2) {
  const spot = new THREE.SpotLight(color, intensity, 14, Math.PI / 5, 0.4, 1.5);
  spot.position.set(x, y, z); spot.castShadow = true;
  scene.add(spot);
  if (target) { spot.target.position.set(target.x, target.y, target.z); scene.add(spot.target); }
  return spot;
}
function addInteractable(mesh, type, radius = 1.4, extra = {}) {
  mesh.userData.interactable = true; mesh.userData.type = type; mesh.userData.radius = radius;
  Object.assign(mesh.userData, extra);
  scene.add(mesh); STATE.interactables.push(mesh); return mesh;
}

function buildHands() {
  handsGroup = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xC79A78, roughness: 0.7 });
  const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
  function makeHand(side) {
    const g = new THREE.Group();
    const palm = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.16), skinMat);
    g.add(palm);
    for (let i = 0; i < 4; i++) {
      const finger = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.018, 0.08), skinMat);
      finger.position.set(-0.03 + i * 0.02, 0, -0.11); g.add(finger);
    }
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.18, 8), sleeveMat);
    sleeve.rotation.x = Math.PI / 2; sleeve.position.set(0, 0, 0.14); g.add(sleeve);
    g.position.set(side === 'left' ? -0.22 : 0.22, -0.22, -0.45);
    g.rotation.y = side === 'left' ? 0.15 : -0.15;
    g.userData.side = side; return g;
  }
  handsGroup.add(makeHand('left')); handsGroup.add(makeHand('right'));
  camera.add(handsGroup); scene.add(camera);
}
buildHands();

let walkTime = 0;
function animateHands(delta, isMoving) {
  walkTime += delta * (isMoving ? 6 : 1.2);
  handsGroup.children.forEach((hand, i) => {
    const dir = i === 0 ? 1 : -1;
    const bob = isMoving ? 0.018 : 0.006;
    hand.position.y = -0.22 + Math.sin(walkTime + dir) * bob;
    hand.position.x = (hand.userData.side === 'left' ? -0.22 : 0.22) + Math.sin(walkTime * 0.5) * 0.01 * dir;
    hand.rotation.z = Math.sin(walkTime + dir) * 0.02;
  });
}

// CINEMATIC SYSTEM
// ============================================================
const CinematicSystem = {
  active: false, waypoints: [], currentIndex: 0,
  holdTimer: 0, onComplete: null, lerpT: 0,

  play(config, onComplete) {
    this.active = true; this.waypoints = config.waypoints;
    this.currentIndex = 0; this.holdTimer = 0; this.lerpT = 0;
    this.onComplete = onComplete; STATE.inCinematic = true;
    if (config.text) {
      const b = document.getElementById('cinematic-text-banner');
      b.textContent = config.text; b.style.display = 'block';
      setTimeout(() => b.classList.add('visible'), 50);
    }
    const first = this.waypoints[0];
    camera.position.set(...first.pos); camera.lookAt(...first.lookAt);
  },

  update(delta) {
    if (!this.active) return;
    const current = this.waypoints[this.currentIndex];
    const next = this.waypoints[this.currentIndex + 1];
    if (!next) {
      this.holdTimer += delta;
      if (this.holdTimer >= current.hold) this.finish();
      return;
    }
    this.lerpT += delta / Math.max(current.hold, 0.4);
    if (this.lerpT >= 1) { this.lerpT = 0; this.currentIndex++; return; }
    const ease = this.lerpT < 0.5 ? 2*this.lerpT*this.lerpT : 1-Math.pow(-2*this.lerpT+2,2)/2;
    const a = current.pos, b = next.pos, la = current.lookAt, lb = next.lookAt;
    camera.position.set(a[0]+(b[0]-a[0])*ease, a[1]+(b[1]-a[1])*ease, a[2]+(b[2]-a[2])*ease);
    camera.lookAt(la[0]+(lb[0]-la[0])*ease, la[1]+(lb[1]-la[1])*ease, la[2]+(lb[2]-la[2])*ease);
  },

  finish() {
    this.active = false; STATE.inCinematic = false;
    const b = document.getElementById('cinematic-text-banner');
    b.classList.remove('visible'); setTimeout(() => { b.style.display = 'none'; }, 600);
    if (this.onComplete) this.onComplete();
  }
};

// STEALTH SYSTEM
// ============================================================
const StealthSystem = {
  active: false, guardMesh: null, visionConeMesh: null,
  patrolPoints: [], currentPatrolIndex: 0, patrolHoldTimer: 0,
  guardSpeed: 1.2, visionRange: 5, visionAngle: 0.6,
  detectionLevel: 0, detected: false, onDetectedCallback: null,
  destination: null, onReachDestination: null,

  init(scene, config, onDetected, onReach) {
    this.active = true; this.patrolPoints = config.guardPatrol;
    this.visionRange = config.guardVisionRange; this.visionAngle = config.guardVisionAngle;
    this.currentPatrolIndex = 0; this.patrolHoldTimer = 0;
    this.detectionLevel = 0; this.detected = false;
    this.onDetectedCallback = onDetected; this.destination = config.destination;
    this.onReachDestination = onReach;

    const guardMat = new THREE.MeshStandardMaterial({ color: 0x4a2020, roughness: 0.8 });
    const body = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.26,1.0,8), guardMat);
    torso.position.y = 0.9; body.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16,8,8), guardMat);
    head.position.y = 1.55; body.add(head);
    body.position.set(this.patrolPoints[0].pos[0], 0, this.patrolPoints[0].pos[2]);
    scene.add(body); this.guardMesh = body;

    const coneGeo = new THREE.ConeGeometry(this.visionRange * Math.tan(this.visionAngle), this.visionRange, 16, 1, true);
    const coneMat = new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.rotation.x = Math.PI/2; cone.position.y = 0.9; cone.position.z = -this.visionRange/2;
    const coneWrapper = new THREE.Group(); coneWrapper.add(cone);
    coneWrapper.position.copy(body.position);
    scene.add(coneWrapper); this.visionConeMesh = coneWrapper;
  },

  reset() { this.active = false; this.guardMesh = null; this.visionConeMesh = null; this.detectionLevel = 0; this.detected = false; },

  update(delta, playerX, playerZ) {
    if (!this.active || !this.guardMesh) return;
    const target = this.patrolPoints[this.currentPatrolIndex];
    const gx = this.guardMesh.position.x, gz = this.guardMesh.position.z;
    const dx = target.pos[0]-gx, dz = target.pos[2]-gz;
    const dist = Math.sqrt(dx*dx+dz*dz);
    if (dist < 0.15) {
      this.patrolHoldTimer += delta;
      if (this.patrolHoldTimer >= target.hold) { this.patrolHoldTimer = 0; this.currentPatrolIndex = (this.currentPatrolIndex+1)%this.patrolPoints.length; }
    } else {
      this.guardMesh.position.x += (dx/dist)*this.guardSpeed*delta;
      this.guardMesh.position.z += (dz/dist)*this.guardSpeed*delta;
      const fa = Math.atan2(dx,dz);
      this.guardMesh.rotation.y = fa; this.visionConeMesh.position.copy(this.guardMesh.position);
      this.visionConeMesh.rotation.y = fa;
    }
    const pdx = playerX-this.guardMesh.position.x, pdz = playerZ-this.guardMesh.position.z;
    const pd = Math.sqrt(pdx*pdx+pdz*pdz);
    let inCone = false;
    if (pd < this.visionRange) {
      const gf = this.guardMesh.rotation.y, ap = Math.atan2(pdx,pdz);
      let ad = Math.abs(gf-ap); if (ad > Math.PI) ad = 2*Math.PI-ad;
      if (ad < this.visionAngle) inCone = true;
    }
    if (inCone) this.detectionLevel = Math.min(1, this.detectionLevel + delta*0.7);
    else this.detectionLevel = Math.max(0, this.detectionLevel - delta*0.4);
    if (this.detectionLevel >= 1 && !this.detected) { this.detected = true; if (this.onDetectedCallback) this.onDetectedCallback(); }
    if (this.detectionLevel < 0.3 && this.detected) this.detected = false;
    if (this.destination) {
      const ddx = playerX-this.destination.pos[0], ddz = playerZ-this.destination.pos[2];
      if (Math.sqrt(ddx*ddx+ddz*ddz) < 1.2) { this.active = false; if (this.onReachDestination) this.onReachDestination(); }
    }
  },
};

// DEDUCTION SYSTEM
// ============================================================
const DeductionSystem = {
  active: false, config: null, selectedClue: null,
  madeConnections: [], onComplete: null,

  start(config, onComplete) {
    this.active = true; this.config = config;
    this.selectedClue = null; this.madeConnections = [];
    this.onComplete = onComplete;
    this.renderBoard();
    document.getElementById('deduction-overlay').style.display = 'flex';
  },

  renderBoard() {
    document.getElementById('deduction-title').textContent = this.config.title;
    const board = document.getElementById('deduction-clues'); board.innerHTML = '';
    this.config.clues.forEach(clue => {
      const node = document.createElement('div'); node.className = 'clue-node';
      node.dataset.id = clue.id; node.textContent = clue.label;
      if (this.selectedClue === clue.id) node.classList.add('selected');
      if (this.isClueConnected(clue.id)) node.classList.add('connected');
      node.addEventListener('click', () => this.handleClueClick(clue.id));
      board.appendChild(node);
    });
    this.renderConnectionLines(); this.updateProgress();
  },

  isClueConnected(id) { return this.madeConnections.some(p => p.includes(id)); },

  handleClueClick(id) {
    if (!this.selectedClue) { this.selectedClue = id; this.renderBoard(); return; }
    if (this.selectedClue === id) { this.selectedClue = null; this.renderBoard(); return; }
    const pair = [this.selectedClue, id].sort();
    const already = this.madeConnections.some(p => p[0]===pair[0]&&p[1]===pair[1]);
    const isCorrect = this.config.correctPairs.some(cp => { const s=[...cp].sort(); return s[0]===pair[0]&&s[1]===pair[1]; });
    if (!already && isCorrect) { this.madeConnections.push(pair); this.showFeedback('Conexión correcta ✓', true); }
    else if (!isCorrect) this.showFeedback('Esa conexión no parece relevante', false);
    this.selectedClue = null; this.renderBoard(); this.checkCompletion();
  },

  showFeedback(text, success) {
    const fb = document.getElementById('deduction-feedback');
    fb.textContent = text; fb.className = success ? 'feedback-success' : 'feedback-fail';
    setTimeout(() => { fb.textContent = ''; fb.className = ''; }, 1400);
  },

  renderConnectionLines() {
    const list = document.getElementById('deduction-connections-list'); list.innerHTML = '';
    this.madeConnections.forEach(pair => {
      const la = this.config.clues.find(c=>c.id===pair[0])?.label||pair[0];
      const lb = this.config.clues.find(c=>c.id===pair[1])?.label||pair[1];
      const li = document.createElement('div'); li.className = 'connection-line-item';
      li.textContent = `🔗 ${la}  ↔  ${lb}`; list.appendChild(li);
    });
  },

  updateProgress() {
    document.getElementById('deduction-progress').textContent = `${this.madeConnections.length} / ${this.config.correctPairs.length} conexiones`;
  },

  checkCompletion() {
    if (this.madeConnections.length >= this.config.correctPairs.length) {
      setTimeout(() => {
        document.getElementById('deduction-conclusion').textContent = this.config.conclusion;
        document.getElementById('deduction-conclusion').style.display = 'block';
        document.getElementById('deduction-continue-btn').style.display = 'block';
      }, 500);
    }
  },

  finish() {
    this.active = false;
    document.getElementById('deduction-overlay').style.display = 'none';
    document.getElementById('deduction-conclusion').style.display = 'none';
    document.getElementById('deduction-continue-btn').style.display = 'none';
    if (this.onComplete) this.onComplete();
  },
};

document.getElementById('deduction-continue-btn').addEventListener('click', () => DeductionSystem.finish());

// ============================================================
// DIALOGUE SYSTEM
// ============================================================
const DialogueSystem = {
  active: false, config: null, currentNodeId: 'start', onComplete: null,

  start(config, onComplete) {
    this.active = true; this.config = config;
    this.currentNodeId = 'start'; this.onComplete = onComplete;
    this.renderUI();
    document.getElementById('dialogue-overlay').style.display = 'flex';
  },

  renderUI() {
    const node = this.config.nodes[this.currentNodeId];
    document.getElementById('dialogue-npc-name').textContent = this.config.npcName;
    document.getElementById('dialogue-npc-line').textContent = node.npcLine;
    const opts = document.getElementById('dialogue-options'); opts.innerHTML = '';
    if (node.isEnding || node.options.length === 0) {
      const btn = document.createElement('button'); btn.className = 'dialogue-option-btn dialogue-end-btn';
      btn.textContent = '[ Finalizar interrogatorio ]';
      btn.addEventListener('click', () => this.finish()); opts.appendChild(btn); return;
    }
    node.options.forEach(opt => {
      const btn = document.createElement('button'); btn.className = 'dialogue-option-btn';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => { this.currentNodeId = opt.next; this.renderUI(); });
      opts.appendChild(btn);
    });
  },

  finish() {
    this.active = false;
    document.getElementById('dialogue-overlay').style.display = 'none';
    if (this.onComplete) this.onComplete();
  },
};

// ============================================================
// NARRATIVE
// ============================================================
let narrativeQueue = [], narrativeCallback = null, narrativeIndex = 0;

function playNarrative(slides, onDone) {
  narrativeQueue = slides; narrativeCallback = onDone; narrativeIndex = 0;
  showNextNarrativeSlide();
}

function showNextNarrativeSlide() {
  if (narrativeIndex >= narrativeQueue.length) {
    const ns = document.getElementById('narrative-screen');
    ns.classList.remove('visible');
    setTimeout(() => { if (narrativeCallback) narrativeCallback(); }, 700);
    return;
  }
  const slide = narrativeQueue[narrativeIndex++];
  const ns = document.getElementById('narrative-screen');
  ns.querySelector('#narrative-text').textContent = slide.text;
  ns.querySelector('#narrative-sub').textContent = slide.sub || '';
  ns.classList.add('visible');
  setTimeout(() => {
    ns.classList.remove('visible');
    setTimeout(showNextNarrativeSlide, 700);
  }, slide.sub ? 2400 : 1800);
}

// ============================================================
// FILE VIEWER
// ============================================================
function openFiles(files, panelTitle) {
  document.getElementById('file-panel-title').textContent = panelTitle;
  const list = document.getElementById('file-list'); list.innerHTML = '';
  files.forEach(file => {
    const item = document.createElement('div');
    item.className = 'file-item' + (STATE.verifiedEvidence.has(file.id) ? ' verified' : '');
    item.innerHTML = `
      <div class="file-item-header">
        <span class="file-tag">${file.tagLabel}</span>
        <span class="file-name">${file.title}</span>
      </div>
      <div class="file-meta">${file.meta}</div>
      <div class="file-detail">${file.detail}</div>`;
    item.addEventListener('click', () => {
      item.classList.toggle('expanded');
      if (!STATE.verifiedEvidence.has(file.id)) {
        STATE.verifiedEvidence.add(file.id);
        if (file.clueId) STATE.verifiedEvidence.add(file.clueId);
        item.classList.add('verified');
        updateEvidenceCounter();
        checkEvidenceComplete();
      }
    });
    list.appendChild(item);
  });
  document.getElementById('file-overlay').classList.add('open');
  STATE.inDevice = true;
}

document.getElementById('file-close-btn').addEventListener('click', () => {
  document.getElementById('file-overlay').classList.remove('open');
  STATE.inDevice = false;
});

function updateEvidenceCounter() {
  const verified = [...STATE.verifiedEvidence].filter(id => !id.startsWith('clue_') && !id.startsWith('l3_clue_')).length;
  document.getElementById('evidence-counter').textContent = `EVIDENCIA ${verified}/${STATE.totalEvidenceThisLevel}`;
}

function checkEvidenceComplete() {
  const relevantIds = getAllLevelEvidenceIds();
  const allVerified = relevantIds.every(id => STATE.verifiedEvidence.has(id));
  if (!allVerified) return;
  if (STATE.currentLevel === 'level1') {
    STATE.deductionUnlocked = true;
    showPrompt('Pizarra de investigación desbloqueada — ve a la pizarra');
  } else if (STATE.currentLevel === 'level2_car') {
    document.getElementById('drive-btn').style.display = 'block';
  } else if (STATE.currentLevel === 'level3') {
    showPrompt('Evidencia completa — habla con el sospechoso');
  }
}

function getAllLevelEvidenceIds() {
  if (STATE.currentLevel === 'level1') return [...GAME_DATA.level1.computerFiles, ...GAME_DATA.level1.phoneFiles].map(f=>f.id);
  if (STATE.currentLevel === 'level2_car') return GAME_DATA.level2.phoneFiles.map(f=>f.id);
  if (STATE.currentLevel === 'level3') return [...GAME_DATA.level3.computerFiles, ...GAME_DATA.level3.phoneFiles].map(f=>f.id);
  return [];
}

// ============================================================
// INTERACTION
// ============================================================
function handleInteract() {
  if (STATE.inDevice || STATE.inCinematic || STATE.inDeduction || STATE.inDialogue) return;
  const near = STATE.nearInteractable;
  if (!near) return;

  const type = near.userData.type;

  if (type === 'computer') {
    const files = STATE.currentLevel === 'level3' ? GAME_DATA.level3.computerFiles : GAME_DATA.level1.computerFiles;
    openFiles(files, 'ARCHIVOS — COMPUTADOR');
  }
  else if (type === 'phone') {
    const files = STATE.currentLevel === 'level2_car' ? GAME_DATA.level2.phoneFiles :
                  STATE.currentLevel === 'level3' ? GAME_DATA.level3.phoneFiles : GAME_DATA.level1.phoneFiles;
    openFiles(files, 'ARCHIVOS — CELULAR');
  }
  else if (type === 'deductionBoard') {
    if (!STATE.deductionUnlocked) { showPrompt('Revisa todos los archivos primero'); return; }
    STATE.inDeduction = true;
    DeductionSystem.start(GAME_DATA.level1.deductionBoard, () => {
      STATE.inDeduction = false; STATE.exitReady = true;
      showPrompt('Investigación completa — ve hacia la salida');
    });
  }
  else if (type === 'exit') {
    if (!STATE.exitReady) { showPrompt('Completa la investigación primero'); return; }
    playNarrative(GAME_DATA.toLevel2, () => {
      STATE.currentLevel = 'level2_car'; buildLevel2_Car();
    });
  }
  else if (type === 'npc') {
    const allVerified = getAllLevelEvidenceIds().every(id => STATE.verifiedEvidence.has(id));
    if (!allVerified) { showPrompt('Revisa toda la evidencia antes de confrontarlo'); return; }
    STATE.inDialogue = true;
    DialogueSystem.start(GAME_DATA.level3.interrogation, () => {
      STATE.inDialogue = false;
      playNarrative(GAME_DATA.ending, () => {
        document.getElementById('level-name').textContent = '';
        document.getElementById('objective-bar').textContent = '';
        document.getElementById('evidence-counter').textContent = '';
      });
    });
  }
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
let mouseDX = 0, mouseLocked = false;

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') handleInteract();
  if (e.code === 'Escape') {
    document.getElementById('file-overlay').classList.remove('open');
    STATE.inDevice = false;
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', () => {
  if (!STATE.inDevice && !STATE.inCinematic && !STATE.inDeduction && !STATE.inDialogue) {
    canvas.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (!mouseLocked) return;
  STATE.player.rotY -= e.movementX * 0.0022;
  mouseDX = e.movementX;
});

// Mobile
let joyActive = false, joyOrigin = {x:0,y:0}, joyDelta = {x:0,y:0};
const joyZone = document.getElementById('joystick-zone');
const joyThumb = document.getElementById('joystick-thumb');
joyZone.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; joyActive=true; joyOrigin={x:t.clientX,y:t.clientY}; }, {passive:false});
joyZone.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; joyDelta={x:t.clientX-joyOrigin.x, y:t.clientY-joyOrigin.y}; const r=50; const mx=Math.max(-r,Math.min(r,joyDelta.x)), my=Math.max(-r,Math.min(r,joyDelta.y)); joyThumb.style.transform=`translate(calc(-50% + ${mx}px), calc(-50% + ${my}px))`; }, {passive:false});
joyZone.addEventListener('touchend', () => { joyActive=false; joyDelta={x:0,y:0}; joyThumb.style.transform='translate(-50%,-50%)'; });
document.getElementById('mobile-interact-btn').addEventListener('touchstart', e => { e.preventDefault(); handleInteract(); }, {passive:false});

let lookDX = 0, lookActive = false, lookLast = 0;
const lookZone = document.getElementById('look-zone');
lookZone.addEventListener('touchstart', e => { lookActive=true; lookLast=e.touches[0].clientX; });
lookZone.addEventListener('touchmove', e => { if (!lookActive) return; const dx=e.touches[0].clientX-lookLast; lookLast=e.touches[0].clientX; STATE.player.rotY -= dx*0.003; });
lookZone.addEventListener('touchend', () => { lookActive=false; });

document.getElementById('drive-btn').addEventListener('click', () => {
  STATE.currentLevel = 'level2_stealth';
  buildLevel2_StealthZone();
});

// ============================================================
// PROMPT
// ============================================================
let promptTimeout;
function showPrompt(text) {
  const p = document.getElementById('interact-prompt');
  p.textContent = text; p.classList.add('visible');
  clearTimeout(promptTimeout);
  promptTimeout = setTimeout(() => p.classList.remove('visible'), 2800);
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  const delta = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  if (STATE.inCinematic) { CinematicSystem.update(delta); renderer.render(scene, camera); return; }
  if (STATE.inDevice || STATE.inDeduction || STATE.inDialogue) { renderer.render(scene, camera); return; }

  // ── Movement ──
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    { mx += Math.sin(STATE.player.rotY); mz += Math.cos(STATE.player.rotY); }
  if (keys['KeyS'] || keys['ArrowDown'])  { mx -= Math.sin(STATE.player.rotY); mz -= Math.cos(STATE.player.rotY); }
  if (keys['KeyA'] || keys['ArrowLeft'])  { mx += Math.sin(STATE.player.rotY - Math.PI/2); mz += Math.cos(STATE.player.rotY - Math.PI/2); }
  if (keys['KeyD'] || keys['ArrowRight']) { mx += Math.sin(STATE.player.rotY + Math.PI/2); mz += Math.cos(STATE.player.rotY + Math.PI/2); }

  if (joyActive) {
    const jx = joyDelta.x/50, jy = joyDelta.y/50;
    mx += Math.sin(STATE.player.rotY)*(-jy) + Math.sin(STATE.player.rotY - Math.PI/2)*(-jx);
    mz += Math.cos(STATE.player.rotY)*(-jy) + Math.cos(STATE.player.rotY - Math.PI/2)*(-jx);
  }

  const len = Math.sqrt(mx*mx+mz*mz);
  const isMoving = len > 0.01;
  if (isMoving) {
    const spd = STATE.player.speed * delta * (STATE.inStealthSection ? 0.7 : 1.0);
    STATE.player.x += (mx/len)*spd;
    STATE.player.z += (mz/len)*spd;
  }

  animateHands(delta, isMoving);

  // Camera follow
  if (!STATE.inVehicle) {
    camera.position.set(STATE.player.x, 1.65, STATE.player.z);
    camera.rotation.set(0, STATE.player.rotY, 0);
  }

  // ── Interactable proximity ──
  let closest = null, closestDist = Infinity;
  STATE.interactables.forEach(obj => {
    const dx = obj.position.x - STATE.player.x;
    const dz = obj.position.z - STATE.player.z;
    const d = Math.sqrt(dx*dx+dz*dz);
    if (d < obj.userData.radius && d < closestDist) { closestDist = d; closest = obj; }
  });
  STATE.nearInteractable = closest;
  const prompt = document.getElementById('interact-prompt');
  if (closest && !STATE.inDevice) {
    const typeLabels = { computer: '[E] Revisar computador', phone: '[E] Revisar celular', deductionBoard: STATE.deductionUnlocked ? '[E] Pizarra de investigación' : '[E] Pizarra (bloqueada)', exit: STATE.exitReady ? '[E] Salir' : '[E] Salida (bloqueada)', npc: '[E] Confrontar' };
    prompt.textContent = typeLabels[closest.userData.type] || '[E] Interactuar';
    if (!prompt.classList.contains('visible')) prompt.classList.add('visible');
  } else if (!STATE.inDevice) {
    prompt.classList.remove('visible');
  }

  // ── Stealth ──
  if (STATE.inStealthSection && StealthSystem.active) {
    StealthSystem.update(delta, STATE.player.x, STATE.player.z);
    const dl = StealthSystem.getDetectionLevel ? StealthSystem.getDetectionLevel() : StealthSystem.detectionLevel;
    document.getElementById('detection-bar-fill').style.width = (dl*100)+'%';
    document.getElementById('detection-bar-fill').style.background = dl > 0.6 ? '#ff3322' : '#ff6644';
  }

  renderer.render(scene, camera);
}

// ============================================================
// START
// ============================================================
function startGame() {
  STATE.currentLevel = 'level1';
  buildLevel1();
  CinematicSystem.play(GAME_DATA.level1.openingCinematic, () => {});
  requestAnimationFrame(gameLoop);
}

playNarrative(GAME_DATA.intro, startGame);
</script>
